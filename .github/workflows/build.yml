name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Unzip Utility
      run: sudo apt-get update && sudo apt-get install -y unzip zip

    - name: Unzip Project Files
      run: |
        find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \;

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Locate and Fix gradlew
      run: |
        GRADLE_FILE=$(find . -name "gradlew" -type f | head -n 1)
        if [ -z "$GRADLE_FILE" ]; then
          echo "محتويات المجلد الحالي بعد فك الضغط:"
          ls -R
          echo "خطأ: الملف salati.zip لا يحتوي على مشروع أندرويد متكامل (ناقص ملف gradlew)."
          exit 1
        fi
        chmod +x "$GRADLE_FILE"

    - name: Build APK
      run: |
        GRADLE_PATH=$(find . -name "gradlew" -type f | head -n 1)
        PROJECT_DIR=$(dirname "$GRADLE_PATH")
        cd "$PROJECT_DIR"
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Salati-APK
        path: "**/build/outputs/apk/debug/*.apk"
