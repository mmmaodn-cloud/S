name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        if [ -f salati.zip ]; then
          unzip -o salati.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: find . -name "gradlew" -exec chmod +x {} +

    - name: Build APK
      run: |
        GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLE_PATH" ]; then
          echo "لم يتم العثور على ملف gradlew!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLE_PATH")
        cd "$PROJECT_DIR"
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Salati-APK
        path: "**/build/outputs/apk/debug/*.apk"
