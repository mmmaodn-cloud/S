name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Unzip and Gradle
      run: sudo apt-get update && sudo apt-get install -y unzip gradle

    - name: Unzip All Zip Files
      run: |
        find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \;

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Wrapper and Permissions
      run: |
        PROJ_DIR=$(find . -name "build.gradle*" -o -name "settings.gradle*" | head -n 1 | xargs dirname)
        if [ -z "$PROJ_DIR" ]; then
          echo "لم يتم العثور على ملفات مشروع أندرويد!"
          exit 1
        fi
        echo "المشروع موجود في: $PROJ_DIR"
        cd "$PROJ_DIR"
        gradle wrapper
        chmod +x gradlew

    - name: Build APK
      run: |
        PROJ_DIR=$(find . -name "build.gradle*" -o -name "settings.gradle*" | head -n 1 | xargs dirname)
        cd "$PROJ_DIR"
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Salati-APK
        path: "**/build/outputs/apk/debug/*.apk"
